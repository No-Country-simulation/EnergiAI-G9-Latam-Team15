# EnergiAI — orquestación local (backend + ml-service)
# Aislado con `name: energiai` y su propia red -> no interfiere con otros proyectos Docker.
# Los puertos del HOST son variables: si 8000/8080 están ocupados, se cambian sin tocar nada más.
# La comunicación backend->ml-service es por la red interna (NO usa puertos del host).
name: energiai

services:
  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    image: energiai-ml:local
    container_name: energiai-ml
    ports:
      - "${ML_HOST_PORT:-8000}:8000"     # host configurable; contenedor fijo en 8000
    networks:
      - energiai-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: energiai-backend:local
    container_name: energiai-backend
    environment:
      # El backend habla con el ml-service por NOMBRE en la red interna (no por host:puerto)
      - ML_SERVICE_URL=http://ml-service:8000
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"  # host configurable; contenedor fijo en 8080
    depends_on:
      ml-service:
        condition: service_healthy          # arranca solo cuando el ML esté sano
    networks:
      - energiai-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    image: energiai-frontend:local
    container_name: energiai-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-5180}:80"
    networks:
      - energiai-net

networks:
  energiai-net:
    name: energiai-net
    driver: bridge
